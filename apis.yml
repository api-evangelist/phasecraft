aid: phasecraft
name: Phasecraft
description: >-
  Phasecraft is a quantum algorithms company building software that combines
  classical and quantum computing to solve real-world problems in materials
  discovery, advanced biochemistry, and optimization. Its algorithms are
  engineered to run efficiently across multiple quantum hardware platforms, and
  its published results include scalable approaches to the Fermi-Hubbard model
  and QAOA-based optimization. Founded by Profs. Ashley Montanaro (CEO) and Toby
  Cubitt (CTO), the company operates from London, Bristol, and Washington DC, and
  is backed by Playground Global. Phasecraft exposes no public developer API; its
  programmatic surface is limited to open research code on GitHub and two
  interactive web tools (a materials database and an optimization graph library).
